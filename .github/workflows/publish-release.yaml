name: Publish Release
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: publish-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-docs:
    name: Build docs
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - uses: actions/setup-python@v6
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: |
          requirements.txt
          dev_requirements.txt

    - name: Restore docs execution cache
      uses: actions/cache@v5
      with:
        path: |
          _freeze
          .jupyter_cache
          gingado/sdmx_http_cache*
        key: ${{ runner.os }}-docs-${{ hashFiles('_quarto.yml', '*.qmd', 'gingado/**/*.py', 'requirements.txt', 'dev_requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-docs-


    - uses: ./.github/actions/render-docs
      with:
        token: ${{ github.token }}

    - name: Upload quarto artifact
      uses: actions/upload-artifact@v4
      with:
        name: quarto-docs
        path: docs


  release:
    name: Release
    runs-on: ubuntu-latest
    needs: build-docs

    environment: pypi
    defaults:
      run:
        shell: bash -euo pipefail {0}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Read package version
        id: package_version
        run: |
          PKG_VERSION=$(python .github/scripts/read_package_version.py)
          echo "value=$PKG_VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify release tag
        env:
          PKG_VERSION: ${{ steps.package_version.outputs.value }}
        run: |
          bash .github/scripts/verify_release_tag.sh "$PKG_VERSION"

      - name: Check version not already on PyPI
        env:
          PKG_VERSION: ${{ steps.package_version.outputs.value }}
        run: |
          bash .github/scripts/check_version_not_on_pypi.sh "$PKG_VERSION"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build==1.4.2 twine==6.2.0

      - name: Build
        run: |
          set -euo pipefail
          python -m build

      - name: Check
        run: |
          set -euo pipefail
          python -m twine check dist/*

      - name: Publish
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: |
          set -euo pipefail
          python -m twine upload --non-interactive dist/*


  publish-docs:
    name: Publish docs
    runs-on: ubuntu-latest
    needs: [release, build-docs]
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Download quarto-docs artifact
        uses: actions/download-artifact@v4
        with:
          name: quarto-docs
          path: docs

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4

